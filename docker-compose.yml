services:
  mysql:
    image: mysql:8.0
    container_name: traversia_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: traversia
      MYSQL_USER: traversia
      MYSQL_PASSWORD: traversia_local
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: traversia_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    container_name: traversia_flyway
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command: >
      -url=jdbc:mysql://mysql:3306/traversia
      -user=traversia
      -password=traversia_local
      -connectRetries=10
      migrate
    environment:
      FLYWAY_BASELINE_ON_MIGRATE: "true"

volumes:
  mysql_data:
